<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="miOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF5000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Xiaomi Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#miOrange)" filter="url(#shadow)" />
  
  <!-- Subtle inner plate -->
  <rect x="56" y="56" width="400" height="400" rx="84" fill="#ffffff" fill-opacity="0.08" />

  <!-- Display Window -->
  <rect x="96" y="96" width="320" height="96" rx="24" fill="#ffffff" fill-opacity="0.22" />
  <!-- Display readout dots / text simulation -->
  <circle cx="126" cy="144" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="146" cy="144" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="290" y="132" width="96" height="24" rx="12" fill="#ffffff" />

  <!-- Keypad Grid Symbols -->
  <!-- Plus (+) -->
  <rect x="132" y="240" width="36" height="10" rx="5" fill="#ffffff" />
  <rect x="145" y="227" width="10" height="36" rx="5" fill="#ffffff" />

  <!-- Minus (−) -->
  <rect x="344" y="240" width="36" height="10" rx="5" fill="#ffffff" />

  <!-- Multiply (×) -->
  <g transform="translate(150, 350) rotate(45)">
    <rect x="-18" y="-5" width="36" height="10" rx="5" fill="#ffffff" />
    <rect x="-5" y="-18" width="10" height="36" rx="5" fill="#ffffff" />
  </g>

  <!-- Equals (=) -->
  <rect x="344" y="338" width="36" height="9" rx="4.5" fill="#ffffff" />
  <rect x="344" y="357" width="36" height="9" rx="4.5" fill="#ffffff" />
</svg>
